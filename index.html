<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Island Vocab — 18 Thế Giới, Slang/Idioms & Boss 45s</title>
    <style>
        :root {
            --sidebar-bg: #5a6d56;
            --sidebar-card: #6b7f66;
            --page-bg: #f6f2e9;
            --page-grad: #e7efe2;
            --card-bg: #fffdf8;
            --sub-card: #faf7f0;
            --ink: #3e3a32;
            --title-ink: #364532;
            --muted: #7c7467;
            --accent-green: #6d8b5e;
            --accent-leaf: #e8f0e2;
            --accent-amber: #d99b26;
            --accent-amber-soft: #fdf4df;
            --accent-sky: #4e89a8;
            --border: #e6decb;
            --shadow: 0 6px 18px rgba(84, 74, 54, 0.08);
            --base-font: 15px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: var(--base-font);
            background: var(--page-bg);
            color: var(--ink);
            min-height: 100vh;
        }
        .cozy-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
            max-width: 1320px;
            margin: 0 auto;
        }
        @media (max-width: 880px) { .cozy-layout { grid-template-columns: 1fr; } }
        .sidebar {
            background: var(--sidebar-bg);
            color: #f7f5ee;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .island-brand { text-align: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.16); }
        .island-brand h1 { margin: 2px 0; font-size: 21px; font-weight: 800; }
        .nav-list { display: flex; flex-direction: column; gap: 4px; }
        .nav-item {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 11px; border-radius: 11px;
            background: transparent; color: #f3f0e6;
            font-size: 13.5px; font-weight: 700; text-align: left;
            width: 100%; cursor: pointer; border: none;
        }
        .nav-item.active { background: var(--card-bg); color: var(--ink); }
        .main-area { padding: 18px 20px 44px; background: linear-gradient(180deg, var(--page-grad) 0%, var(--page-bg) 170px); }
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: 700; -webkit-tap-highlight-color: transparent; }
        .cozy-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 15px 17px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }
        .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
        .card-header-row h2 { margin: 0; font-size: 15.5px; font-weight: 800; }
        .scenario-btn {
            width: 100%; text-align: left;
            background: var(--accent-amber-soft); border: 1.5px solid #f0d79c;
            border-radius: 13px; padding: 10px 12px; color: var(--ink); margin-bottom: 7px;
        }
        .scenario-btn strong { display: block; font-size: 13.5px; color: var(--accent-amber); }
        .scenario-btn span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
        .btn-cozy-green { padding: 10px 14px; background: var(--accent-green); color: #fff; font-size: 13px; }
        .btn-audio { padding: 9px 13px; background: var(--accent-sky); color: #fff; font-size: 13px; }
        .btn-slow { padding: 9px 11px; background: var(--sub-card); border: 1px solid var(--border); color: var(--ink); font-size: 13px; }
        .btn-prev { padding: 9px 11px; background: var(--sub-card); border: 1px solid var(--border); color: var(--ink); font-size: 13px; }
        .btn-next { padding: 10px 16px; background: #3a9259; color: #fff; font-size: 13.5px; }
        #hoc-khu-vuc { display: none; }
        .flash-card {
            background: var(--card-bg); border: 1.5px solid var(--border);
            border-left: 6px solid var(--accent-green); border-radius: 18px;
            padding: 18px; box-shadow: var(--shadow); margin-bottom: 12px;
        }
        .question-line { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        #cau-hoi { font-size: 19px; font-weight: 800; color: var(--title-ink); line-height: 1.45; flex: 1; min-width: 220px; }
        #o-nhap {
            width: 100%; font-size: 19px; padding: 14px 15px;
            border: 2.5px solid var(--border); border-radius: 14px; outline: none;
            background: var(--card-bg); color: var(--ink); -webkit-appearance: none;
        }
        .dung { background: #eaf7ee !important; border-color: #3a9259 !important; color: #1f5c35 !important; }
        .sai { background: #fdecea !important; border-color: #d65345 !important; color: #8c271d !important; }
        #banner-enter {
            display: none; margin-top: 12px; background: #eaf7ee; border: 2px solid #59ad76;
            border-radius: 14px; padding: 13px 15px; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .voice-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--card-bg); font-size: 12.5px; font-weight: 600; color: var(--ink); }
    </style>
</head>
<body>
    <div class="cozy-layout">
        <aside class="sidebar">
            <div class="island-brand">
                <h1>Cozy Island</h1>
                <div style="font-size:12px; opacity:0.85;">Slang • Idioms • iPhone Audio</div>
            </div>
            <nav class="nav-list">
                <button class="nav-item active" id="nav-home" onclick="veTrangChu()">🏡 Trang tổng quan</button>
                <button class="nav-item" id="nav-office" onclick="batDauKichBan('office')">🏢 Công sở</button>
                <button class="nav-item" id="nav-hangout" onclick="batDauKichBan('hangout')">🍻 Tụ tập cuối tuần</button>
                <button class="nav-item" id="nav-shopping" onclick="batDauKichBan('shopping')">🛍️ Mua sắm & Sale</button>
            </nav>
            <div style="margin-top:auto; background:rgba(255,255,255,0.12); border-radius:12px; padding:10px; font-size:12px;">
                XP hiện tại: <b id="hud-xp">0</b> • Đã học: <b id="hud-cnt">0</b>
            </div>
        </aside>

        <main class="main-area">
            <div id="nhap-du-lieu">
                <section class="cozy-card">
                    <div class="card-header-row">
                        <h2>🔥 Chọn kịch bản luyện tập</h2>
                        <span style="font-size:12px; color:var(--muted);">Chạm vào kịch bản để mở</span>
                    </div>
                    <button class="scenario-btn" onclick="batDauKichBan('office')">
                        <strong>🏢 1. Sinh tồn nơi công sở</strong>
                        <span>burn the midnight oil • circle back • touch base • on the same page • call it a day</span>
                    </button>
                    <button class="scenario-btn" onclick="batDauKichBan('hangout')">
                        <strong>🍻 2. Tụ tập bạn bè cuối tuần</strong>
                        <span>rain check • spill the tea • no-brainer • ghost • down to earth</span>
                    </button>
                    <button class="scenario-btn" onclick="batDauKichBan('shopping')">
                        <strong>🛍️ 3. Mua sắm & Săn Sale</strong>
                        <span>break the bank • rip-off • window shopping • steal • impulse buy</span>
                    </button>
                </section>
            </div>

            <div id="hoc-khu-vuc">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
                    <div>
                        <strong id="ten-bai-hoc" style="font-size:16px;"></strong> • <span id="tien-do" style="font-size:13px; color:var(--muted);"></span>
                    </div>
                    <button class="btn-prev" onclick="veTrangChu()">⬅️ Về trang đầu</button>
                </div>

                <div class="flash-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                        <span id="nhan-kieu-bai" style="font-size:12px; font-weight:800; color:var(--accent-green);">💡 NGHĨA TIẾNG VIỆT → GÕ TIẾNG ANH</span>
                        <select class="voice-sel" id="chon-giong-uk" onchange="doiGiong(this.value)">
                            <option value="ios">📱 Giọng iPhone (en-GB)</option>
                            <option value="youdao">🌐 Audio từ điển (Youdao)</option>
                        </select>
                    </div>

                    <div class="question-line">
                        <div id="cau-hoi"></div>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <button class="btn-audio" onclick="phatAm(dapAnChuan, false)">🔊 Nghe</button>
                            <button class="btn-slow" onclick="phatAm(dapAnChuan, true)">🐢 Chậm</button>
                        </div>
                    </div>

                    <div id="goi-y-box" style="display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:15px;"></div>
                </div>

                <input type="text" id="o-nhap" placeholder="Gõ câu tiếng Anh..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

                <div id="banner-enter">
                    <div style="font-weight:800; color:#1f5c35;">✅ Đúng rồi (+15 XP)!</div>
                    <button class="btn-next" onclick="cauTiepTheo()">⏭️ Câu tiếp theo</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const KICH_BAN = {
            office: {
                ten: "🏢 Sinh tồn nơi công sở",
                items: [
                    { viet: "Mình đã thức khuya làm việc để kịp bản trình bày sáng nay.", anh: "I burned the midnight oil to get the deck ready for this morning" },
                    { viet: "Chúng ta hãy quay lại bàn bạc vấn đề này sau khi có số liệu mới.", anh: "Let's circle back on this once we have the updated numbers" },
                    { viet: "Mình nhắn để liên lạc nhanh cập nhật tình hình dự án hôm nay.", anh: "Just touching base to see how the project is moving today" },
                    { viet: "Hãy đảm bảo cả nhóm đang cùng chung quan điểm trước khi làm tiếp.", anh: "Let's make sure we're all on the same page before moving ahead" },
                    { viet: "Xong mục này rồi thì kết thúc công việc trong ngày và nghỉ ngơi thôi.", anh: "Once this is wrapped up, let's call it a day and rest" }
                ]
            },
            hangout: {
                ten: "🍻 Tụ tập bạn bè cuối tuần",
                items: [
                    { viet: "Tối nay mình bận mất rồi, xin hẹn dịp khác nhé.", anh: "Something came up tonight, so can we take a rain check" },
                    { viet: "Cuối tuần gặp nhau kể chuyện hóng hớt đi, dạo này có gì mới không?", anh: "Come spill the tea this weekend what's been going on lately" },
                    { viet: "Chọn quán cà phê yên tĩnh ngay gần nhà là quyết định quá dễ dàng.", anh: "Picking that quiet cafe nearby is a total no-brainer" },
                    { viet: "Cậu ấy bỗng dưng biến mất cắt đứt liên lạc không lý do.", anh: "They just ghosted out of nowhere after we made plans" },
                    { viet: "Ai cũng quý cô ấy vì tính cách rất thực tế và gần gũi.", anh: "Everyone likes her because she's so down to earth" }
                ]
            },
            shopping: {
                ten: "🛍️ Mua sắm & Săn Sale",
                items: [
                    { viet: "Mình muốn mua món đồ tốt nhưng không tốn quá nhiều tiền.", anh: "I want something decent without breaking the bank" },
                    { viet: "Trả nhiều tiền như vậy cho món đồ cơ bản đúng là bị chém giá.", anh: "Paying that much for a basic item feels like a total rip-off" },
                    { viet: "Chiều nay mình chỉ đi ngắm đồ cho vui mắt chứ không mua.", anh: "I'm just doing some window shopping this afternoon not buying anything" },
                    { viet: "Săn được chiếc áo khoác tốt thế này với giá nửa giá đúng là món hời.", anh: "Getting a jacket this good at half price is a real steal" },
                    { viet: "Chiếc túi này là mua sắm bốc đồng lúc lướt mạng đêm khuya.", anh: "This bag was a classic impulse buy while scrolling late at night" }
                ]
            }
        };

        let xp = 0, learnedCount = 0;
        let danhSach = [], idx = 0, dapAnChuan = "", xongRoi = false;
        let giong = "ios";
        let audioPlayer = null;

        function doiGiong(val) {
            giong = val;
            if (dapAnChuan) phatAm(dapAnChuan, false);
        }

        function phatAm(text, slow) {
            const clean = (text || "").trim();
            if (!clean) return;

            if (audioPlayer) {
                try { audioPlayer.pause(); } catch (e) {}
                audioPlayer = null;
            }

            if (giong === "youdao") {
                const a = new Audio("https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(clean) + "&type=1");
                a.setAttribute("playsinline", "true");
                a.playbackRate = slow ? 0.8 : 1.0;
                audioPlayer = a;
                a.play().catch(function () {
                    docBangSpeech(clean, slow);
                });
                return;
            }

            docBangSpeech(clean, slow);
        }

        function docBangSpeech(clean, slow) {
            if (!("speechSynthesis" in window)) return;
            try {
                const u = new SpeechSynthesisUtterance(clean);
                const voices = window.speechSynthesis.getVoices() || [];
                const gb = voices.find(function (v) { return /en[-_]GB/i.test(v.lang); }) || voices.find(function (v) { return /^en/i.test(v.lang); });
                if (gb) {
                    u.voice = gb;
                    u.lang = gb.lang;
                } else {
                    u.lang = "en-GB";
                }
                u.rate = slow ? 0.8 : 0.96;
                u.volume = 1.0;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function veTrangChu() {
            document.getElementById("hoc-khu-vuc").style.display = "none";
            document.getElementById("nhap-du-lieu").style.display = "block";
        }

        function batDauKichBan(key) {
            const kb = KICH_BAN[key];
            if (!kb) return;
            danhSach = kb.items.slice();
            idx = 0;
            xongRoi = false;
            document.getElementById("nhap-du-lieu").style.display = "none";
            document.getElementById("hoc-khu-vuc").style.display = "block";
            document.getElementById("ten-bai-hoc").innerText = kb.ten;
            hienCau();
        }

        function hienCau() {
            xongRoi = false;
            if (idx >= danhSach.length) {
                alert("Xong kịch bản này rồi!");
                veTrangChu();
                return;
            }
            const item = danhSach[idx];
            dapAnChuan = item.anh;
            document.getElementById("tien-do").innerText = "Câu " + (idx + 1) + " / " + danhSach.length;
            document.getElementById("cau-hoi").innerText = item.viet;
            document.getElementById("goi-y-box").style.display = "none";
            document.getElementById("banner-enter").style.display = "none";
            const inp = document.getElementById("o-nhap");
            inp.readOnly = false;
            inp.value = "";
            inp.className = "";
            inp.focus();
            phatAm(dapAnChuan, false);
        }

        function cauTiepTheo() {
            idx++;
            hienCau();
        }

        function chuanHoa(s) {
            return (s || "").toLowerCase().replace(/[^a-z0-9\s']/g, " ").replace(/\s+/g, " ").trim();
        }

        document.getElementById("o-nhap").addEventListener("input", function () {
            if (xongRoi) return;
            const target = chuanHoa(dapAnChuan);
            const typed = chuanHoa(this.value);
            if (!typed) {
                this.className = "";
                return;
            }
            if (target.indexOf(typed) === 0) {
                this.className = "dung";
                if (typed === target) {
                    xongRoi = true;
                    xp += 15;
                    learnedCount += 1;
                    document.getElementById("hud-xp").innerText = xp;
                    document.getElementById("hud-cnt").innerText = learnedCount;
                    document.getElementById("o-nhap").readOnly = true;
                    const gBox = document.getElementById("goi-y-box");
                    gBox.style.display = "block";
                    gBox.innerHTML = "<b>Đáp án:</b> " + dapAnChuan;
                    document.getElementById("banner-enter").style.display = "flex";
                    phatAm(dapAnChuan, false);
                }
            } else {
                this.className = "sai";
            }
        });
    </script>
</body>
</html>
